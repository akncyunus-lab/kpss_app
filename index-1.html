<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPSS Cep</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fb;
    color:#172033;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    padding:18px;
  }
  .header{
    background:linear-gradient(135deg,#173b7a,#2459a8);
    color:white;
    border-radius:20px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 8px 24px rgba(20,55,110,.18);
  }
  .header h1{margin:0 0 6px;font-size:28px}
  .header p{margin:0;opacity:.9}
  .card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 5px 18px rgba(25,45,80,.08);
  }
  .hidden{display:none!important}
  .title{font-size:21px;font-weight:700;margin:0 0 14px}
  .subtitle{color:#687386;margin:0 0 16px}
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  button{
    border:0;
    border-radius:14px;
    padding:15px 14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    background:#eef3fb;
    color:#173b7a;
  }
  button:hover{filter:brightness(.98)}
  .primary{background:#2459a8;color:#fff}
  .secondary{background:#e9eef7;color:#173b7a}
  .lesson-btn,.topic-btn{
    min-height:64px;
    text-align:left;
  }
  .lesson-btn span,.topic-btn span{
    display:block;
    font-size:13px;
    font-weight:500;
    color:#718096;
    margin-top:5px;
  }
  .back{
    margin-bottom:14px;
    padding:10px 14px;
    font-size:14px;
  }
  .progress-wrap{
    background:#e9eef7;
    height:9px;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 18px;
  }
  .progress{
    height:100%;
    width:0;
    background:#2459a8;
    transition:width .25s;
  }
  .question-number{
    color:#2459a8;
    font-weight:700;
    margin-bottom:8px;
  }
  .question{
    font-size:20px;
    line-height:1.45;
    font-weight:700;
    white-space:pre-line;
    margin-bottom:18px;
  }
  .options{display:grid;gap:11px}
  .option{
    background:#f5f7fb;
    border:2px solid #e3e8f0;
    color:#172033;
    text-align:left;
    font-weight:600;
  }
  .option:hover{background:#edf3ff}
  .option.correct{
    background:#dff6e6;
    border-color:#29a354;
    color:#176b36;
  }
  .option.wrong{
    background:#fde3e3;
    border-color:#d94848;
    color:#9d2222;
  }
  .option:disabled{cursor:default}
  .feedback{
    margin-top:15px;
    padding:13px 15px;
    border-radius:12px;
    font-weight:700;
    display:none;
  }
  .feedback.correct{display:block;background:#e7f8ec;color:#176b36}
  .feedback.wrong{display:block;background:#fff0f0;color:#9d2222}
  .actions{display:flex;gap:10px;margin-top:16px}
  .actions button{flex:1}
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:15px 0;
  }
  .stat{
    background:#f4f7fb;
    border-radius:13px;
    padding:13px;
    text-align:center;
  }
  .stat strong{display:block;font-size:22px}
  .stat small{color:#687386}
  .explain{line-height:1.65;font-size:15px}.explain h3{margin-top:0}.explain ul{padding-left:20px}.actions span{display:block;font-size:12px;font-weight:500;margin-top:4px}.empty{
    padding:18px;
    background:#fff6df;
    color:#775a12;
    border-radius:12px;
    line-height:1.5;
  }

  .daily-fact{
    background:linear-gradient(135deg,#fff8e8,#f3f7ff);
    border:1px solid #e7edf7;
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 5px 18px rgba(25,45,80,.06);
  }
  .daily-fact-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .daily-fact-label{
    color:#2459a8;
    font-weight:800;
    font-size:15px;
  }
  .daily-fact-category{
    background:#e8eef9;
    color:#173b7a;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:700;
  }
  .daily-fact-question{
    font-size:17px;
    line-height:1.45;
    font-weight:700;
    margin:0 0 12px;
  }
  .daily-fact-answer{
    display:none;
    background:white;
    border-radius:12px;
    padding:12px 14px;
    color:#26354d;
    line-height:1.5;
    margin-bottom:12px;
  }
  .daily-fact-answer.show{display:block}
  .daily-fact-answer strong{color:#2459a8}
  .daily-fact button{
    width:100%;
    padding:11px 14px;
    font-size:14px;
  }

  @media(max-width:520px){
    .grid{grid-template-columns:1fr}
    .app{padding:12px}
    .header h1{font-size:24px}
    .question{font-size:18px}
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>📚 KPSS Cep</h1>
    <p>Dersini, seviyeni ve konunu seç; sorulara başla.</p>
  </div>


  <!-- GÜNÜN GENEL KÜLTÜR BİLGİSİ -->
  <section id="dailyFactCard" class="daily-fact">
    <div class="daily-fact-top">
      <div class="daily-fact-label">🧠 Günün Genel Kültür Bilgisi</div>
      <div id="dailyFactCategory" class="daily-fact-category">Genel Kültür</div>
    </div>
    <p id="dailyFactQuestion" class="daily-fact-question"></p>
    <div id="dailyFactAnswer" class="daily-fact-answer"></div>
    <button id="dailyFactButton" class="primary" type="button" onclick="toggleDailyFact()">💡 Cevabı Göster</button>
  </section>

  <!-- SEVİYE -->
  <section id="levelScreen" class="card">
    <h2 class="title">🎯 KPSS Seviyeni Seç</h2>
    <p class="subtitle">Sorular seçtiğin seviyeye göre filtrelenecek.</p>
    <div class="grid">
      <button class="lesson-btn" onclick="selectLevel('Ortaöğretim')">
        🏫 Ortaöğretim
        <span>Ortaöğretim düzeyi</span>
      </button>
      <button class="lesson-btn" onclick="selectLevel('Ön Lisans')">
        🎓 Ön Lisans
        <span>Ön lisans düzeyi</span>
      </button>
      <button class="lesson-btn" onclick="selectLevel('Lisans')">
        🎓 Lisans
        <span>Lisans düzeyi</span>
      </button>
    </div>
  </section>

  <!-- DERS -->
  <section id="lessonScreen" class="card hidden">
    <button class="secondary back" onclick="goToLevel()">← Seviyelere Dön</button>
    <h2 class="title">📚 Ders Seç</h2>
    <p id="selectedLevelText" class="subtitle"></p>
    <div id="lessonList" class="grid"></div>
  </section>

  <!-- KONU -->
  <section id="topicScreen" class="card hidden">
    <button class="secondary back" onclick="goToLessons()">← Derslere Dön</button>
    <h2 id="topicTitle" class="title">📖 Konu Seç</h2>
    <p id="topicSubtitle" class="subtitle"></p>
    <div id="topicList" class="grid"></div>
  </section>

  <!-- KONU SEÇİMİ -->
  <section id="topicActionScreen" class="card hidden">
    <button class="secondary back" onclick="goToTopics()">← Konulara Dön</button>
    <h2 id="actionTitle" class="title">📚 Konu</h2>
    <p id="actionSubtitle" class="subtitle"></p>
    <div class="actions">
      <button class="primary" onclick="openExplanation()">📖 Konu Anlatımı<span>Konuyu öğren ve tekrar et</span></button>
      <button onclick="startQuiz(selectedTopic)">📝 Test Çöz<span id="topicQuestionCount">Soruları çöz</span></button>
    </div>
  </section>

  <!-- KONU ANLATIMI -->
  <section id="explanationScreen" class="card hidden">
    <button class="secondary back" onclick="goToTopicAction()">← Konuya Dön</button>
    <h2 id="explanationTitle" class="title">📖 Konu Anlatımı</h2>
    <p id="explanationSubtitle" class="subtitle"></p>
    <div id="explanationBody" class="explain"></div>
    <div class="actions"><button class="primary" onclick="startQuiz(selectedTopic)">📝 Bu Konudan Test Çöz</button></div>
  </section>

  <!-- SINAV -->
  <section id="quizScreen" class="card hidden">
    <button class="secondary back" onclick="goToTopics()">← Konulara Dön</button>
    <div id="quizMeta" class="subtitle"></div>

    <div class="progress-wrap">
      <div id="progressBar" class="progress"></div>
    </div>

    <div id="questionNumber" class="question-number"></div>
    <div id="questionText" class="question"></div>
    <div id="options" class="options"></div>

    <div id="feedback" class="feedback"></div>

    <div class="actions">
      <button id="nextBtn" class="primary hidden" onclick="nextQuestion()">Sonraki Soru →</button>
    </div>
  </section>

  <!-- SONUÇ -->
  <section id="resultScreen" class="card hidden">
    <h2 class="title">🎉 Test Tamamlandı</h2>
    <p id="resultTitle" class="subtitle"></p>

    <div class="stats">
      <div class="stat"><strong id="totalStat">0</strong><small>Toplam</small></div>
      <div class="stat"><strong id="correctStat">0</strong><small>Doğru</small></div>
      <div class="stat"><strong id="wrongStat">0</strong><small>Yanlış</small></div>
    </div>

    <div class="actions">
      <button class="primary" onclick="repeatQuiz()">🔄 Tekrar Çöz</button>
      <button class="secondary" onclick="goToTopics()">📖 Konular</button>
    </div>
  </section>

</div>

<script src="questions.js"></script>
<script>
"use strict";

/*
  KPSS Cep - yeni akış:
  Seviye → Ders → Konu → Sorular

  questions.js içindeki mevcut kayıtlar:
  question, options, answer, level, lesson

  Yeni soru bankasında ayrıca:
  topic: "Problemler"
  gibi bir alan kullanılabilir.

  topic alanı olmayan mevcut sorular "Tüm Konular" altında çalışmaya devam eder.
*/

let selectedLevel = "";
let selectedLesson = "";
let selectedTopic = "";

let questionPool = [];
let currentQuestion = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

const LESSONS = [
  {name:"Türkçe", icon:"📖"},
  {name:"Matematik", icon:"➗"},
  {name:"Tarih", icon:"🏛️"},
  {name:"Coğrafya", icon:"🌍"},
  {name:"Vatandaşlık", icon:"⚖️"}
];
const ALAN_LESSONS = [
  {name:"Hukuk",icon:"⚖️"},{name:"İktisat",icon:"📈"},{name:"Maliye",icon:"💰"},
  {name:"Muhasebe",icon:"🧾"},{name:"İşletme",icon:"🏢"},{name:"Kamu Yönetimi",icon:"🏛️"},
  {name:"Uluslararası İlişkiler",icon:"🌐"},{name:"Çalışma Ekonomisi",icon:"👥"}
];

/*
  Konular daha sonra soru bankasındaki topic alanlarıyla eşleşecek.
  Şimdilik "Tüm Konular" daima çalışır.
*/
const TOPICS = {
  "Türkçe": [
    "Sözcükte Anlam",
    "Cümlede Anlam",
    "Paragraf",
    "Dil Bilgisi",
    "Ses Bilgisi",

    "Noktalama İşaretleri",

  ],
  "Matematik": [
    "Temel Kavramlar",

    "Oran-Orantı",

    "Grafik ve Tablo",

  ],
  "Tarih": [
    "İslamiyet Öncesi Türk Tarihi",

  ]
};

TOPICS["Hukuk"]=["Anayasa Hukuku","İdare Hukuku","Medeni Hukuk","Borçlar Hukuku","Ceza Hukuku","Ticaret Hukuku","İcra ve İflas Hukuku"];
TOPICS["İktisat"]=["İktisada Giriş","Mikro İktisat","Makro İktisat","Para-Banka","Uluslararası İktisat","Türkiye Ekonomisi","İktisadi Büyüme ve Kalkınma"];
TOPICS["Maliye"]=["Maliye Teorisi","Kamu Harcamaları","Kamu Gelirleri","Kamu Borçları","Bütçe","Vergi Hukuku","Maliye Politikası"];
TOPICS["Muhasebe"]=["Genel Muhasebe","Mali Tablolar","Maliyet Muhasebesi","Finansal Muhasebe","Muhasebe Standartları"];
TOPICS["İşletme"]=["İşletme Yönetimi","Pazarlama","Finansal Yönetim","Üretim Yönetimi","İnsan Kaynakları","Örgütsel Davranış"];
TOPICS["Kamu Yönetimi"]=["Yönetim Bilimi","Siyaset Bilimi","Kentleşme ve Çevre Sorunları","Türk İdare Tarihi","Kamu Politikası"];
TOPICS["Uluslararası İlişkiler"]=["Uluslararası İlişkilere Giriş","Uluslararası Hukuk","Uluslararası Örgütler","Siyasi Tarih","Uluslararası Politika"];
TOPICS["Çalışma Ekonomisi"]=["Çalışma Ekonomisine Giriş","İş Hukuku","Sosyal Güvenlik Hukuku","Çalışma İlişkileri","İşgücü Piyasaları"];

function getQuestionsArray(){
  // questions.js dosyasında const questions olarak tanımlanan soru bankasını kullan.
  if (typeof questions !== "undefined" && Array.isArray(questions)) return questions;
  if (Array.isArray(window.questions)) return window.questions;
  return [];
}

function filterQuestions(level, lesson, topic){
  const all = getQuestionsArray();

  let result = all.filter(q =>
    q &&
    q.level === level &&
    q.lesson === lesson
  );

  /*
    Mevcut soru bankasında topic alanı yoksa
    "Tüm Konular" bütün soruları gösterir.
  */
  if(topic !== "Tüm Konular"){
    const withTopic = result.filter(q => q.topic === topic);

    /*
      Henüz topic alanları eklenmemişse kullanıcı boş ekran görmesin.
      Bu durumda konuya ait soru bulunmadığını açıkça gösteriyoruz.
    */
    return withTopic;
  }

  return result;
}

function selectLevel(level){
  selectedLevel = level;
  selectedLesson = "";
  selectedTopic = "";

  document.getElementById("levelScreen").classList.add("hidden");
  document.getElementById("lessonScreen").classList.remove("hidden");

  document.getElementById("selectedLevelText").textContent =
    "Seçilen seviye: " + level;

  renderLessons();
}

function renderLessons(){
  const container = document.getElementById("lessonList");
  container.innerHTML = "";

  const lessonSet = selectedLevel === "Lisans" ? LESSONS.concat(ALAN_LESSONS) : LESSONS;
  lessonSet.forEach(lesson => {
    const count = getQuestionsArray().filter(q =>
      q && q.level === selectedLevel && q.lesson === lesson.name
    ).length;

    const btn = document.createElement("button");
    btn.className = "lesson-btn";
    btn.innerHTML =
      lesson.icon + " " + lesson.name +
      "<span>" + count + " soru bankada</span>";

    btn.onclick = () => selectLesson(lesson.name);
    container.appendChild(btn);
  });
}

function selectLesson(lesson){
  selectedLesson = lesson;
  selectedTopic = "";

  document.getElementById("lessonScreen").classList.add("hidden");
  document.getElementById("topicScreen").classList.remove("hidden");

  document.getElementById("topicTitle").textContent =
    "📖 " + lesson + " Konuları";

  document.getElementById("topicSubtitle").textContent =
    selectedLevel + " • " + lesson;

  renderTopics();
}

function renderTopics(){
  const container = document.getElementById("topicList");
  container.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = "topic-btn primary";
  allBtn.innerHTML =
    "📚 Tüm Konular" +
    "<span>Bu dersin tüm mevcut sorularını çöz</span>";
  allBtn.onclick = () => { selectedTopic = "Tüm Konular"; openTopicAction(); };
  container.appendChild(allBtn);

  (TOPICS[selectedLesson] || []).forEach(topic => {
    const count = filterQuestions(selectedLevel, selectedLesson, topic).length;

    const btn = document.createElement("button");
    btn.className = "topic-btn";
    btn.innerHTML =
      "📝 " + topic +
      "<span>" + count + " soru</span>";

    btn.onclick = () => { selectedTopic = topic; openTopicAction(); };
    container.appendChild(btn);
  });
}

const EXPLANATIONS={
"Ses Bilgisi":"<h3>Ses Bilgisi</h3><p>Ünlü ve ünsüzlerin özellikleri ile temel ses olaylarını inceler.</p><ul><li>Ünlü daralması ve düşmesi</li><li>Ünsüz yumuşaması ve sertleşmesi</li><li>Ünsüz türemesi ve kaynaştırma</li></ul>",
"Sözcükte Anlam":"<h3>Sözcükte Anlam</h3><p>Sözcüklerin anlamı yalnızca sözlükteki karşılıklarından değil, kullanıldıkları cümleden de anlaşılır. KPSS'de bu konu; sözcüğün temel anlamı, yan anlamı, mecaz anlamı, terim anlamı ve sözcükler arasındaki anlam ilişkileri üzerinden ölçülür.</p><h4>1. Gerçek (Temel) Anlam</h4><p>Sözcüğün akla gelen ilk ve en yaygın anlamıdır. <b>‘Ağır çantayı kaldırdı.’</b> cümlesinde ‘ağır’ gerçek anlamdadır.</p><h4>2. Yan Anlam</h4><p>Sözcüğün temel anlamıyla bağlantısını koruyarak kazandığı yeni anlamdır. <b>‘Masanın ayağı kırıldı.’</b> cümlesinde ‘ayak’ yan anlamdadır; insan ayağıyla biçim ve işlev bakımından ilişkilidir.</p><h4>3. Mecaz Anlam</h4><p>Sözcüğün gerçek anlamından uzaklaşıp soyut veya farklı bir anlam kazanmasıdır. <b>‘Bu sözler onu kırdı.’</b> cümlesinde fiziksel bir kırılma yoktur; ‘kırmak’ mecazdır.</p><h4>4. Terim Anlam</h4><p>Bir bilim, sanat, spor veya meslek alanına özgü özel anlamdır. <b>‘Üçgenin iç açıları toplamı 180 derecedir.’</b> cümlesindeki ‘açı’ matematik terimidir.</p><h4>5. Anlam İlişkileri</h4><ul><li><b>Eş anlam:</b> Anlamları aynı veya çok yakın olan sözcükler. Örnek: yanıt–cevap.</li><li><b>Zıt anlam:</b> Anlam bakımından karşıtlık taşıyan sözcükler. Örnek: alçak–yüksek.</li><li><b>Genel-özel:</b> ‘Canlı → kuş → serçe’ gibi kapsam ilişkileri.</li><li><b>Somut-soyut:</b> Duyularla algılanabilen / kavram, duygu ve düşünce bildiren anlamlar.</li><li><b>Nitel-nicel:</b> Özelliği / ölçülebilir miktarı bildiren anlamlar.</li></ul><h4>KPSS İpucu</h4><p>Bir sözcüğü tek başına yorumlama. Önce cümlenin tamamına, sonra sözcüğün çevresindeki ifadelere bak. Özellikle aynı sözcüğün farklı cümlelerdeki anlamını soran sorularda <b>bağlam</b> belirleyicidir.</p>",
"Cümlede Anlam":"<h3>Cümlede Anlam</h3><p>Neden-sonuç, amaç-sonuç, koşul-sonuç, çıkarım ve olasılık gibi anlam ilişkilerini kapsar.</p>",
"Paragraf":"<h3>Paragraf</h3><p>Ana düşünce, yardımcı düşünce, konu, başlık ve paragrafın yapısı üzerinde durulur.</p>",
"Temel Kavramlar":"<h3>Temel Kavramlar</h3><p>Sayı kümeleri, işlem özellikleri ve temel matematik kavramlarını kapsar.</p>",
"Problemler":"<h3>Problemler</h3><p>Verilen bilgileri matematiksel modele dönüştürme ve uygun çözüm stratejisini seçme becerisini geliştirir.</p>",
"Atatürk İlke ve İnkılapları":"<h3>Atatürk İlke ve İnkılapları</h3><p>Atatürk dönemi siyasi, sosyal, hukuki, ekonomik ve kültürel dönüşümleri kapsar.</p>",
"Millî Mücadele":"<h3>Millî Mücadele</h3><p>Millî Mücadele'nin hazırlık dönemi, TBMM, cepheler, antlaşmalar ve diplomatik gelişmeleri kapsar.</p>",
"Türkiye'nin Coğrafi Konumu":"<h3>Türkiye'nin Coğrafi Konumu</h3><p>Matematik ve özel konumun iklim, ulaşım, ekonomi ve jeopolitik sonuçlarını inceler.</p>",

function startQuiz(topic){
  selectedTopic = topic;

  questionPool = filterQuestions(
    selectedLevel,
    selectedLesson,
    selectedTopic
  );

  if(questionPool.length === 0){
    alert(
      selectedTopic === "Tüm Konular"
      ? "Bu ders ve seviyede henüz soru bulunamadı."
      : "Bu konu için henüz soru eklenmedi. Önce soru bankasına bu konuya ait soruları ekleyeceğiz."
    );
    return;
  }

  /*
    Soruları karıştırıyoruz ama cevap indekslerine dokunmuyoruz.
  */
  questionPool = shuffle([...questionPool]);

  currentQuestion = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = false;

  document.getElementById("topicScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  document.getElementById("quizMeta").textContent =
    selectedLevel + " • " +
    selectedLesson + " • " +
    selectedTopic +
    " • " + questionPool.length + " soru";

  loadQuestion();
}

function loadQuestion(){
  if(currentQuestion >= questionPool.length){
    finishQuiz();
    return;
  }

  answered = false;

  const q = questionPool[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "Soru " + (currentQuestion + 1) + " / " + questionPool.length;

  document.getElementById("questionText").textContent =
    q.question;

  document.getElementById("progressBar").style.width =
    ((currentQuestion + 1) / questionPool.length * 100) + "%";

  const options = document.getElementById("options");
  options.innerHTML = "";

  const feedback = document.getElementById("feedback");
  feedback.className = "feedback";
  feedback.textContent = "";

  document.getElementById("nextBtn").classList.add("hidden");

  q.options.forEach((text, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent =
      String.fromCharCode(65 + index) + ") " + text;

    button.onclick = () => selectAnswer(index, button);
    options.appendChild(button);
  });
}

function selectAnswer(index, button){
  if(answered) return;

  answered = true;

  const q = questionPool[currentQuestion];
  const allOptions = document.querySelectorAll(".option");

  allOptions.forEach(btn => {
    btn.disabled = true;
  });

  if(index === q.answer){
    button.classList.add("correct");
    correctCount++;

    showFeedback(
      "✓ Doğru cevap!",
      true
    );
  }else{
    button.classList.add("wrong");

    if(allOptions[q.answer]){
      allOptions[q.answer].classList.add("correct");
    }

    wrongCount++;

    showFeedback(
      "✗ Yanlış cevap. Doğru cevap: " +
      String.fromCharCode(65 + q.answer) +
      ") " + q.options[q.answer],
      false
    );
  }

  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("nextBtn").textContent =
    currentQuestion === questionPool.length - 1
    ? "Testi Bitir ✓"
    : "Sonraki Soru →";
}

function showFeedback(text, isCorrect){
  const box = document.getElementById("feedback");

  box.textContent = text;
  box.className =
    "feedback " + (isCorrect ? "correct" : "wrong");
}

function nextQuestion(){
  if(!answered) return;

  currentQuestion++;

  if(currentQuestion >= questionPool.length){
    finishQuiz();
    return;
  }

  loadQuestion();
}

function finishQuiz(){
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("resultTitle").textContent =
    selectedLevel + " • " +
    selectedLesson + " • " +
    selectedTopic;

  document.getElementById("totalStat").textContent =
    questionPool.length;

  document.getElementById("correctStat").textContent =
    correctCount;

  document.getElementById("wrongStat").textContent =
    wrongCount;
}

function repeatQuiz(){
  /*
    Aynı seviye + ders + konu tekrar seçilir.
    Diğer derslerin soruları kesinlikle karışmaz.
  */
  startQuiz(selectedTopic);
}

function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

let dailyFactIndex = 0;

function initDailyFact(){
  const now = new Date();
  const dayNumber = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  dailyFactIndex = Math.abs(dayNumber) % DAILY_FACTS.length;
  const fact = DAILY_FACTS[dailyFactIndex];

  document.getElementById('dailyFactCategory').textContent = fact.category;
  document.getElementById('dailyFactQuestion').textContent = fact.q;
  document.getElementById('dailyFactAnswer').innerHTML = '<strong>Cevap:</strong> ' + fact.a;
  document.getElementById('dailyFactAnswer').classList.remove('show');
  document.getElementById('dailyFactButton').textContent = '💡 Cevabı Göster';
}

function toggleDailyFact(){
  const answer = document.getElementById('dailyFactAnswer');
  const button = document.getElementById('dailyFactButton');
  const isShown = answer.classList.toggle('show');
  button.textContent = isShown ? '🙈 Cevabı Gizle' : '💡 Cevabı Göster';
}
