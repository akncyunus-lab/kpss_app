name: KPSS Cep APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyasını hazırla
        run: |
          mkdir -p www
          INDEX_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "index.html" -print -quit)
          echo "Bulunan dosya: $INDEX_FILE"
          cp "$INDEX_FILE" www/index.html
          cp "$GITHUB_WORKSPACE/questions.js" www/questions.js

      - name: Capacitor Android projesini oluştur
        run: |
          npx cap init "KPSS Cep" "com.kpsscep.app" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Release imza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kpss-release.jks

      - name: Android sürüm ve imza ayarlarını yap
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]

          text = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "1.0.{version_code}"',
              text,
              count=1
          )

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("kpss-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          text = text.replace(
              '    buildTypes {',
              signing_block + '\n    buildTypes {',
              1
          )

          text = text.replace(
              '        release {',
              '        release {\n            signingConfig signingConfigs.release',
              1
          )

          path.write_text(text)
          PY

      - name: APK oluştur
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KPSS-Cep-APK
          path: android/app/build/outputs/apk/release/app-release.apk