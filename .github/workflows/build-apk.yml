name: KPSS Cep APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyasını hazırla
        run: npm run build

      - name: Capacitor Android projesini oluştur
        run: |
          npx cap init "KPSS Cep" "com.kpsscep.app" --web-dir www
          npx cap add android
          npx cap copy android

      - name: APK oluştur
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KPSS-Cep-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
